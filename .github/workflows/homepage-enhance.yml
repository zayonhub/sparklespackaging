name: Homepage enhancement
on:
  push:
    branches: [homepage-video-upgrade]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage enhancement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text()
          marker = '/* SPARKLES HOMEPAGE CONVERSION UPGRADE */'
          if marker not in s:
              s += '''\n\n/* SPARKLES HOMEPAGE CONVERSION UPGRADE */\n@media (min-width: 760px){\n  .home-hero-grid{\n    grid-template-columns:minmax(330px,0.82fr) minmax(0,1.18fr);\n    align-items:center;\n  }\n  .home-hero-visual{\n    transform:translateX(8px);\n  }\n  .home-video-mosaic{\n    height:560px;\n  }\n  .video-primary{\n    width:calc(64% - 8px);\n  }\n  .video-stack{\n    width:calc(36% - 8px);\n  }\n}\n@media (min-width:1100px){\n  .home-video-mosaic{\n    height:620px;\n  }\n}\n@media (max-width:759px){\n  .home-video-mosaic{\n    padding-bottom:42px;\n  }\n  .video-primary{\n    height:280px;\n  }\n  .video-secondary,.video-tertiary{\n    height:180px;\n  }\n}\n.home-hero-copy .button-primary{\n  box-shadow:0 10px 24px rgba(245,144,31,0.28);\n}\n.home-hero-copy .button-primary:hover{\n  box-shadow:0 12px 28px rgba(245,144,31,0.38);\n}\n'''
              p.write_text(s)
          PY
      - name: Commit enhancement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve homepage conversion and enlarge hero video"
          git push
