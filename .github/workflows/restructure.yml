name: Consolidate Sparkles navigation
on:
  push:
    branches: [feature/site-restructure-5-pages]
permissions:
  contents: write
jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate primary navigation and footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          primary = [
              ('index.html', 'Home'),
              ('products.html', 'Products'),
              ('services.html', 'Services'),
              ('about.html', 'About'),
              ('contact.html', 'Contact'),
          ]

          nav_links = ''.join(f'<a class="nav-link" href="{href}">{label}</a>' for href, label in primary)
          nav_pattern = re.compile(r'<nav class="main-nav" aria-label="Primary navigation">.*?</nav>', re.S)
          footer_explore_pattern = re.compile(r'(<p class="footer-label">Explore</p>).*?(</div>)', re.S)

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if not nav_pattern.search(text):
                  continue
              mobile = re.search(r'<button class="nav-cta mobile-only".*?</button>', text, re.S)
              mobile_cta = mobile.group(0) if mobile else '<button class="nav-cta mobile-only" data-whatsapp="Hello Sparkles, I would like to request a packaging quote.">Get a quote</button>'
              text = nav_pattern.sub(f'<nav class="main-nav" aria-label="Primary navigation">{nav_links}{mobile_cta}</nav>', text, count=1)

              def footer_replace(match):
                  links = ''.join(f'<a href="{href}">{label}</a>' for href, label in primary)
                  return match.group(1) + links + match.group(2)
              text = footer_explore_pattern.sub(footer_replace, text, count=1)
              path.write_text(text, encoding='utf-8')

          # Update the repository documentation to reflect the actual architecture.
          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = re.sub(r'A full rebuild of the site with no framework and no build step:.*?shared script\.', 'A focused five-page static site with no framework and no build step: Home, Products, Services, About, and Contact. Legacy content pages remain available for existing URLs and are intentionally kept out of primary navigation.', text, count=1, flags=re.S)
              readme.write_text(text, encoding='utf-8')
          PY
      - name: Validate HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              assert text.count('<nav class="main-nav"') == 1, path
              assert text.count('</nav>') == 1, path
              assert text.count('<footer class="site-footer"') == 1, path
              for href in ['index.html','products.html','services.html','about.html','contact.html']:
                  assert href in text, f'{path}: missing {href}'
          print('Navigation/footer validation passed for all HTML pages.')
          PY
      - name: Commit restructuring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' README.md
          git diff --cached --quiet || git commit -m "Consolidate site into five primary pages"
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/restructure.yml
          git commit -m "Remove one-shot restructure workflow"
          git push
